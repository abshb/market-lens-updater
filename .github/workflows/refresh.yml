name: Refresh private market data
on:
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: Export the saved web dataset without provider calls
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      GH_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_REPO: abshb/market-lens-ios
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test failure safeguards
        run: python -m unittest -v test_worker
      - name: Restore private code and state
        run: python worker.py restore
      - name: Install dependencies
        working-directory: private/backend
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-scheduled.txt
      - name: Test public export boundaries
        run: python -m unittest -v test_export_mobile
      - name: Refresh and save private state
        if: inputs.publish_only != true
        run: python worker.py refresh
      - name: Export existing web dataset
        if: inputs.publish_only == true
        run: python worker.py publish-web
      - name: Export mobile price files
        if: vars.PUBLIC_DATA_ENABLED == 'true'
        run: python export_mobile.py
      - name: Upload mobile site
        if: vars.PUBLIC_DATA_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: vars.PUBLIC_DATA_ENABLED == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy saved prices
        id: deployment
        uses: actions/deploy-pages@v4
