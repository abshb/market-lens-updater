name: Verify saved private data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_REPO: abshb/market-lens-ios
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore latest saved private data
        run: python worker.py restore
      - name: Install read-only verification dependencies
        run: python -m pip install pandas pyarrow
      - name: Verify saved prices, benchmark, and scan
        run: python verify_saved.py
